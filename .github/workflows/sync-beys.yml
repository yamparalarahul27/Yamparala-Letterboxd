name: Sync data from Fandom

# Manual trigger only.
# To run from GitHub mobile / web: Actions tab → "Sync data from Fandom" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to sync"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - beys
          - characters
          - parts
      ids:
        description: "Specific ids to sync (space-separated). Leave empty for everything."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Beyblade sync
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'beys' }}
        env:
          IDS: ${{ github.event.inputs.ids }}
        run: |
          if [ -n "$IDS" ]; then
            echo "Syncing beys: $IDS"
            npm run sync:beys -- $IDS
          else
            echo "Syncing all beys"
            npm run sync:beys
          fi

      - name: Run Character sync
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'characters' }}
        env:
          IDS: ${{ github.event.inputs.ids }}
        run: |
          if [ -n "$IDS" ]; then
            echo "Syncing characters: $IDS"
            npm run sync:characters -- $IDS
          else
            echo "Syncing all characters"
            npm run sync:characters
          fi

      - name: Run Parts sync
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'parts' }}
        env:
          IDS: ${{ github.event.inputs.ids }}
        run: |
          if [ -n "$IDS" ]; then
            echo "Syncing parts: $IDS"
            npm run sync:parts -- $IDS
          else
            echo "Syncing all parts"
            npm run sync:parts
          fi

      - name: Commit and push if anything changed
        env:
          TARGET: ${{ github.event.inputs.target }}
          IDS: ${{ github.event.inputs.ids }}
          RUN: ${{ github.run_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/beyblades.json data/characters.json data/parts/
          [ -d public/beys ] && git add public/beys/ || true
          [ -d public/bladers ] && git add public/bladers/ || true
          [ -d public/parts ] && git add public/parts/ || true
          if git diff --staged --quiet; then
            echo "::notice::No changes after sync."
            exit 0
          fi
          git commit -m "data: sync ${TARGET:-all} from Fandom (run #$RUN)" -m "IDs: ${IDS:-all}"
          git push
