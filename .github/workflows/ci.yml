name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Lint + per-file line cap (see CLAUDE.md).
      - name: Check
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
